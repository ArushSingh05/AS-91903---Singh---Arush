<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Gabru Groomers</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header>
    <nav class="navbar">
        <div class="logo"><h2>Gabru Groomers</h2></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="services_prices.html">Services & Prices</a></li>
            <li><a href="barbers.html">Barbers</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="faq_policies.html">FAQ</a></li>
            <li><a href="booking.html" class="book-btn">Book Now</a></li>
            <li class="nav-auth-item"></li>
        </ul>
        <div class="hamburger"><span></span><span></span><span></span></div>
    </nav>
</header>
<main>
    <section class="booking-form-section pt-120">
        <div class="container max-w-520">
            <div class="booking-form">
                <h2 class="mb-18 color-gold text-center">Create an Account</h2>
                <form id="registerForm" method="POST" action="#">
                    <div class="form-group">
                        <label for="name">Full name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="password_confirm">Confirm Password</label>
                        <input type="password" id="password_confirm" name="password_confirm" required>
                    </div>
                    <div class="submit-area"><button type="submit" class="btn-primary">Create account</button></div>
                </form>
                <p class="muted text-center mt-12">Already have an account? <a href="login.html">Login</a></p>
            </div>
        </div>
    </section>
</main>
<script src="js/script.js"></script>
</body>
</html>
