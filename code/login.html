<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login | Gabru Groomers</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header>
    <nav class="navbar">
        <div class="logo"><h2>Gabru Groomers</h2></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="services_prices.html">Services & Prices</a></li>
            <li><a href="barbers.html">Barbers</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="faq_policies.html">FAQ</a></li>
            <li><a href="booking.html" class="book-btn">Book Now</a></li>
            <li class="nav-auth-item"></li>
        </ul>
        <div class="hamburger"><span></span><span></span><span></span></div>
    </nav>
</header>
<main class="pt-120">
    <section class="container max-w-520">
        <div class="booking-form">
            <h2 class="mb-18 color-gold text-center">Login</h2>
            <form id="loginPageForm">
                <div class="form-group">
                    <label for="login_email">Email</label>
                    <input type="email" id="login_email" name="login_email" required>
                </div>
                <div class="form-group">
                    <label for="login_pass">Password</label>
                    <input type="password" id="login_pass" name="login_pass" required>
                </div>
                <div class="submit-area"><button type="submit" class="btn-primary">Login</button></div>
            </form>
            <p class="muted text-center mt-12">Don't have an account? <a href="register.html">Register</a></p>
        </div>
    </section>
</main>
<script src="js/script.js"></script>
</body>
</html>
